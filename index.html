<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Turnierverwaltung</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; margin: 0; }
  .shell { display: flex; height: 100vh; overflow: hidden; }

  .inhalt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .inhalt-rahmen { flex: 1; border: none; width: 100%; height: 100%; background: var(--bg); }

  .willkommen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .willkommen h1 { margin-bottom: 8px; }

  .modul-nav {
    width: 240px; flex-shrink: 0; background: var(--bg-panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: flex-start; padding: 20px 16px; gap: 8px; overflow-y: auto;
  }
  .modul-nav .kopf { width: 100%; text-align: left; margin-bottom: 10px; }
  .modul-nav .kopf .eyebrow { margin: 0 0 4px; }
  .modul-nav .kopf h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin: 0; }
  .modul-nav .kopf .turniername { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }

  .modul-btn {
    width: 100%; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; color: var(--text); cursor: pointer; font-family: var(--font-body); font-size: 14px;
    transition: border-color .15s ease, background .15s ease;
  }
  .modul-btn .num { color: var(--accent); font-family: var(--font-display); font-weight: 700; margin-right: 6px; }
  .modul-btn:hover { border-color: var(--line-hi); background: var(--bg-panel-hi); }
  .modul-btn.active { border-color: var(--accent); background: var(--accent-soft); }

  .turnier-aktionen { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .turnier-aktionen button {
    width: 100%; text-align: left; background: var(--bg-panel-hi); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; color: var(--text); cursor: pointer; font-family: var(--font-body); font-size: 13px;
  }
  .turnier-aktionen button:hover { border-color: var(--line-hi); }
  .trennlinie { width: 100%; border: none; border-top: 1px solid var(--line); margin: 4px 0 10px; }

  .archiv-liste { width: 100%; display: none; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 260px; overflow-y: auto; }
  .archiv-liste.offen { display: flex; }
  .archiv-eintrag {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  }
  .archiv-eintrag.aktiv { border-color: var(--accent); }
  .archiv-eintrag .info { text-align: left; overflow: hidden; }
  .archiv-eintrag .info .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .archiv-eintrag .info .datum { color: var(--text-dim); font-size: 11px; }
  .archiv-eintrag .aktionen { display: flex; gap: 4px; flex-shrink: 0; }
  .archiv-eintrag button { background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--text); padding: 4px 8px; font-size: 11px; cursor: pointer; }
  .archiv-eintrag button:hover { border-color: var(--line-hi); }

  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .modul-nav { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; border-right: none; border-bottom: 1px solid var(--line); }
    .modul-nav .kopf { width: auto; margin-right: auto; text-align: left; }
    .modul-btn { width: auto; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="modul-nav">
    <div class="kopf">
      <p class="eyebrow">Stocksport</p>
      <h2>Turnierverwaltung</h2>
      <div class="turniername" id="turnierNameAnzeige"></div>
    </div>

    <div class="turnier-aktionen">
      <button onclick="neuesTurnierStarten()">🆕 Neues Turnier starten</button>
      <button onclick="archivUmschalten()">🗂 Frühere Turniere<span id="archivPfeil"> ▾</span></button>
    </div>
    <div class="archiv-liste" id="archivListe"></div>
    <hr class="trennlinie">
    <button class="modul-btn" data-modul="01_turniername.html" onclick="oeffneModul(this)"><span class="num">01</span>Turniername</button>
    <button class="modul-btn" data-modul="02_mannschaften.html" onclick="oeffneModul(this)"><span class="num">02</span>Mannschaften</button>
    <button class="modul-btn" data-modul="03_turnierplan.html" onclick="oeffneModul(this)"><span class="num">03</span>Turnierplan</button>
    <button class="modul-btn" data-modul="04_wertungskarten.html" onclick="oeffneModul(this)"><span class="num">04</span>Wertungskarten</button>
    <button class="modul-btn" data-modul="05_ergebnis.html" onclick="oeffneModul(this)"><span class="num">05</span>Ergebniseingabe</button>
    <button class="modul-btn" data-modul="06_tabelle.html" onclick="oeffneModul(this)"><span class="num">06</span>Tabelle</button>
    <button class="modul-btn" data-modul="07_anleitung.html" onclick="oeffneModul(this)"><span class="num">?</span>Anleitung</button>
  </div>

  <div class="inhalt">
    <div class="willkommen" id="willkommen">
      <p class="eyebrow">Turnierverwaltung</p>
      <h1>Willkommen</h1>
      <p class="lead">Wähle links ein Modul aus, um zu starten.</p>
    </div>
    <iframe id="modulRahmen" class="inhalt-rahmen" style="display:none;"></iframe>
  </div>
</div>

<script src="turnier.js"></script>
<script>
function oeffneModul(btn) {
    document.querySelectorAll('.modul-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.getElementById('willkommen').style.display = 'none';
    const rahmen = document.getElementById('modulRahmen');
    rahmen.style.display = 'block';
    rahmen.src = btn.dataset.modul;
}

async function ladeTurniernameAnzeige() {
    const t = await tvLoad();
    const turniername = (t.stammdaten || {}).turniername;
    document.getElementById('turnierNameAnzeige').textContent = turniername || '(noch kein Name festgelegt)';
}

async function neuesTurnierStarten() {
    const bestaetigt = confirm(
        'Neues Turnier starten?\n\nDas aktuelle Turnier bleibt im Archiv erhalten und kann jederzeit ' +
        'unter "Frühere Turniere" wieder geöffnet werden. Es werden also keine Daten gelöscht.'
    );
    if (!bestaetigt) return;

    const ergebnis = await tvNeuesTurnier();
    if (!ergebnis) return;

    await ladeTurniernameAnzeige();
    document.querySelectorAll('.modul-btn').forEach(b => b.classList.remove('active'));
    const rahmen = document.getElementById('modulRahmen');
    rahmen.style.display = 'none';
    rahmen.src = '';
    document.getElementById('willkommen').style.display = 'flex';
    if (document.getElementById('archivListe').classList.contains('offen')) {
        await archivLaden();
    }
}

async function archivUmschalten() {
    const liste = document.getElementById('archivListe');
    const offen = liste.classList.toggle('offen');
    document.getElementById('archivPfeil').textContent = offen ? ' ▴' : ' ▾';
    if (offen) await archivLaden();
}

async function archivLaden() {
    const liste = document.getElementById('archivListe');
    liste.innerHTML = '<div style="color:var(--text-dim); font-size:12.5px;">Lade…</div>';
    const turniere = await tvListeTurniere();
    if (turniere.length === 0) {
        liste.innerHTML = '<div style="color:var(--text-dim); font-size:12.5px;">Noch keine Turniere vorhanden.</div>';
        return;
    }
    liste.innerHTML = '';
    turniere.forEach(t => {
        const eintrag = document.createElement('div');
        eintrag.className = 'archiv-eintrag' + (t.aktiv ? ' aktiv' : '');
        eintrag.innerHTML = `
            <div class="info">
              <div class="name">${t.turniername}</div>
              <div class="datum">${t.datum || t.erstellt_am.split(' ')[0]}${t.aktiv ? ' · aktiv' : ''}</div>
            </div>
            <div class="aktionen">
              ${t.aktiv ? '' : `<button data-aktion="oeffnen" data-id="${t.id}">Öffnen</button>`}
              <button data-aktion="loeschen" data-id="${t.id}">🗑</button>
            </div>`;
        liste.appendChild(eintrag);
    });

    liste.querySelectorAll('button[data-aktion="oeffnen"]').forEach(btn => {
        btn.onclick = async () => {
            const ok = await tvTurnierAktivieren(Number(btn.dataset.id));
            if (!ok) return;
            await ladeTurniernameAnzeige();
            await archivLaden();
            // Aktuell geöffnetes Modul mit den Daten des neu aktivierten Turniers neu laden
            const rahmen = document.getElementById('modulRahmen');
            if (rahmen.src) rahmen.src = rahmen.src;
        };
    });
    liste.querySelectorAll('button[data-aktion="loeschen"]').forEach(btn => {
        btn.onclick = async () => {
            const bestaetigt = confirm('Dieses Turnier endgültig löschen? Das kann nicht rückgängig gemacht werden.');
            if (!bestaetigt) return;
            const ok = await tvTurnierLoeschen(Number(btn.dataset.id));
            if (!ok) return;
            await ladeTurniernameAnzeige();
            await archivLaden();
            const rahmen = document.getElementById('modulRahmen');
            if (rahmen.src) rahmen.src = rahmen.src;
        };
    });
}

ladeTurniernameAnzeige();
</script>
</body>
</html>
